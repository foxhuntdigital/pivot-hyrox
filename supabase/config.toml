# Supabase local config.
#
# `content` must be listed in api.schemas — PostgREST only exposes schemas it is
# told about, and the curated workout library lives outside `public` so its
# read-only policy is separate from athlete data.

project_id = "pivot"

[api]
enabled = true
port = 54321
schemas = ["public", "content", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

# Content is generated by scripts/convert-seed.mjs and is a full upsert: every
# table lands with `on conflict do update`, so applying it to a database that
# already holds an earlier version of the library converges it rather than
# failing on duplicate keys. That is what makes it safe to push at a project
# with live athletes on it.
[db.seed]
enabled = true
sql_paths = ["./seed/01_content.sql"]

[auth]
enabled = true
site_url = "pivot://"
additional_redirect_urls = ["pivot://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Apple and Google sign-in per PRD §6.1. Secrets come from the environment,
# never from this file.
[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[functions.onboarding-plan]
verify_jwt = true

# RevenueCat has no user JWT to present, so this one authenticates on a shared
# secret in the Authorization header instead (see the function).
[functions.revenuecat-webhook]
verify_jwt = false

[functions.history]
verify_jwt = true

[functions.today]
verify_jwt = true

[functions.adapt]
verify_jwt = true

[functions.complete-workout]
verify_jwt = true
